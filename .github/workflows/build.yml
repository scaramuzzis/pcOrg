name: Build

on:
  push:
    branches: ["**", "!screenshots"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test PcOrg.sln -c Release

      # Prove con servizi reali (catalogo di winget): informative, non bloccano la build.
      - name: Test con internet
        continue-on-error: true
        env:
          PCORG_ONLINE_TESTS: "1"
        run: dotnet test tests/PcOrg.Core.Tests -c Release --no-build --filter "FullyQualifiedName~Indice_reale" --logger "console;verbosity=detailed"

      # Screenshot dell'app con dati di esempio, pubblicati sul ramo "screenshots".
      - name: Screenshot
        id: shots
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 12
        env:
          PCORG_SCREENSHOTS: ${{ github.workspace }}\screenshots
        run: dotnet test tests/PcOrg.App.Tests -c Release --no-build --filter "FullyQualifiedName~Screenshots"

      - name: Avanzamento degli screenshot
        if: always() && github.event_name == 'push'
        run: if (Test-Path screenshot-avanzamento.txt) { Get-Content screenshot-avanzamento.txt }

      - name: Pubblica gli screenshot
        if: github.event_name == 'push' && steps.shots.outcome == 'success'
        continue-on-error: true
        run: |
          cd screenshots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshot della build ${{ github.sha }}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screenshots

      - name: Carica gli screenshot
        if: github.event_name == 'push' && steps.shots.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: screenshot
          path: screenshots/*.png

      # Confronto con le schermate approvate (tests/PcOrg.App.Tests/Riferimenti): fallisce se una cambia troppo.
      - name: Confronto con i riferimenti
        id: visual
        if: github.event_name == 'push' && steps.shots.outcome == 'success'
        env:
          PCORG_SCREENSHOTS: ${{ github.workspace }}\screenshots
          PCORG_REFERENCES: ${{ github.workspace }}\tests\PcOrg.App.Tests\Riferimenti
        run: dotnet test tests/PcOrg.App.Tests -c Release --no-build --filter "FullyQualifiedName~VisualRegression"

      - name: Carica il confronto
        if: always() && steps.visual.outcome != 'skipped'
        uses: actions/upload-artifact@v5
        with:
          name: confronto-screenshot
          path: confronto-screenshot/
          if-no-files-found: ignore

      # Tre pacchetti: portatile (consigliato), leggero (richiede .NET 10 Desktop Runtime), file unico.
      - name: Pubblica i pacchetti
        run: |
          dotnet publish src/PcOrg.App -c Release -p:Pacchetto=Portatile -o out/portatile/GestioneFile
          dotnet publish src/PcOrg.App -c Release -p:Pacchetto=Leggero -o out/leggero/GestioneFile
          dotnet publish src/PcOrg.App -c Release -p:Pacchetto=FileUnico -o out/fileunico
          Compress-Archive -Path out/portatile/GestioneFile -DestinationPath GestioneFile-portatile-win-x64.zip
          Compress-Archive -Path out/leggero/GestioneFile -DestinationPath GestioneFile-leggero-win-x64.zip
          Copy-Item out/fileunico/GestioneFile.exe GestioneFile.exe

      # Installer MSI (installazione in Programmi, per tutti gli utenti) costruito dal pacchetto portatile.
      - name: Installer MSI
        id: msi
        continue-on-error: true
        run: |
          $v = ([xml](Get-Content src/PcOrg.App/PcOrg.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          dotnet build installer/GestioneFile.Installer.wixproj -c Release -p:SourceDir=..\out\portatile\GestioneFile -p:ProductVersion=$v
          Copy-Item installer/bin/x64/Release/GestioneFile-win-x64.msi GestioneFile-win-x64.msi -ErrorAction SilentlyContinue
          if (-not (Test-Path GestioneFile-win-x64.msi)) { Get-ChildItem installer/bin -Recurse -Filter *.msi | Select-Object -First 1 | Copy-Item -Destination GestioneFile-win-x64.msi }
          # Prova: installazione silenziosa, controllo dei file, disinstallazione.
          $p = Start-Process msiexec.exe -ArgumentList '/i', 'GestioneFile-win-x64.msi', '/qn', '/l*v', 'msi-install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi-install.log -Tail 60; throw "Installazione MSI non riuscita (codice $($p.ExitCode))." }
          $exe = Join-Path $env:ProgramFiles 'Gestione File\GestioneFile.exe'
          if (-not (Test-Path $exe)) { throw "Dopo l'installazione manca $exe." }
          if (-not (Test-Path (Join-Path $env:ProgramFiles 'Gestione File\GestioneFile.installato'))) { throw "Manca il contrassegno dell'installazione." }
          $p = Start-Process msiexec.exe -ArgumentList '/x', 'GestioneFile-win-x64.msi', '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Disinstallazione MSI non riuscita (codice $($p.ExitCode))." }
          Write-Host "Installer MSI ${v}: installazione e disinstallazione riuscite."

      # Prova di avvio reale: lancia ogni exe pubblicato (con dati isolati in una copia temporanea)
      # e fallisce se entro 90 secondi non compare la finestra principale. I test dell'interfaccia
      # costruiscono la finestra direttamente e non passano dall'avvio vero del programma.
      - name: Prova di avvio degli eseguibili
        run: |
          $casi = @{ portatile = 'out/portatile/GestioneFile'; leggero = 'out/leggero/GestioneFile'; fileunico = 'out/fileunico' }
          foreach ($nome in $casi.Keys) {
            $dir = Join-Path $env:RUNNER_TEMP "avvio-$nome"
            Copy-Item $casi[$nome] $dir -Recurse
            New-Item -ItemType Directory (Join-Path $dir 'pcOrg-dati') | Out-Null
            $p = Start-Process (Join-Path $dir 'GestioneFile.exe') -PassThru
            $ok = $false
            foreach ($i in 1..90) {
              Start-Sleep -Seconds 1
              $p.Refresh()
              if ($p.HasExited) { break }
              if ($p.MainWindowTitle -like 'Gestione File *') { $ok = $true; break }
            }
            $titolo = $p.MainWindowTitle
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            $log = Join-Path $dir 'pcOrg-dati/log/pcorg.log'
            if (Test-Path $log) { Get-Content $log -Encoding UTF8 }
            if (-not $ok) { throw "Pacchetto ${nome}: la finestra principale non è comparsa (titolo: '$titolo', uscito: $($p.HasExited))." }
            Write-Host "Pacchetto ${nome}: finestra principale comparsa dopo $i s."
          }

      - name: Carica i pacchetti
        uses: actions/upload-artifact@v5
        with:
          name: GestioneFile-win-x64
          path: |
            GestioneFile-portatile-win-x64.zip
            GestioneFile-leggero-win-x64.zip
            GestioneFile.exe
            GestioneFile-win-x64.msi
          if-no-files-found: warn

      # Si pubblica una Release quando si spinge un tag v* oppure quando il messaggio
      # del commit contiene [release] (la versione viene letta da PcOrg.App.csproj).
      - name: Versione
        id: ver
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        run: |
          $v = ([xml](Get-Content src/PcOrg.App/PcOrg.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = if ('${{ github.ref }}'.StartsWith('refs/tags/')) { '${{ github.ref_name }}' } else { "v$v" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Release
        if: steps.ver.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Gestione File ${{ steps.ver.outputs.tag }}
          body: |
            ## Quale scaricare
            - **GestioneFile-portatile-win-x64.zip** (consigliato): estrai la cartella `GestioneFile` dove vuoi e avvia `GestioneFile.exe`. Contiene tutto il necessario, si avvia velocemente.
            - **GestioneFile-leggero-win-x64.zip** (2–3 MB): come il portatile ma richiede il [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0); se manca, Windows propone di scaricarlo.
            - **GestioneFile.exe**: un unico file da copiare, più lento ad avviarsi perché deve decomprimersi.
            - **GestioneFile-win-x64.msi**: installazione classica in Programmi con collegamento nel menu Start, adatta anche alla distribuzione in azienda (criteri di gruppo, Intune).

            Se compare "PC protetto da Windows": Ulteriori informazioni → Esegui comunque.
          files: |
            GestioneFile-portatile-win-x64.zip
            GestioneFile-leggero-win-x64.zip
            GestioneFile.exe
            GestioneFile-win-x64.msi
