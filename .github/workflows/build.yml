name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test tests/PcOrg.Core.Tests -c Release

      - name: Pubblica eseguibile unico
        run: dotnet publish src/PcOrg.App -c Release -o publish

      - name: Carica PcOrg.exe
        uses: actions/upload-artifact@v5
        with:
          name: PcOrg-win-x64
          path: publish/PcOrg.exe

      - name: Crea lo zip
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path publish/PcOrg.exe -DestinationPath PcOrg-win-x64.zip

      - name: Release (solo per i tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: pcOrg ${{ github.ref_name }}
          body: |
            Scarica **PcOrg-win-x64.zip**, estrai `PcOrg.exe` e avvialo: non serve installare nulla.
            Se compare "PC protetto da Windows": Ulteriori informazioni → Esegui comunque.
          files: |
            PcOrg-win-x64.zip
            publish/PcOrg.exe
